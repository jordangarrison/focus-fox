name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64-linux: tarball + deb + rpm + arch
          - os: ubuntu-24.04-arm # aarch64-linux: tarball + deb + rpm + arch
          - os: macos-14 # aarch64-darwin: tarball
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # v21+ installs Determinate Nix by default; keep upstream Nix.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Build release assets
        run: |
          nix build .#release
          mkdir dist
          cp -L result/* dist/

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Upload workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: focus-fox-${{ matrix.os }}
          path: dist/*

  update-homebrew:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          response="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            repos/jordangarrison/homebrew-tap/actions/workflows/update-formula.yml/dispatches \
            -f ref=main \
            -f "inputs[formula]=focus-fox" \
            -f "inputs[tag]=$RELEASE_TAG")"
          run_id="$(jq -r '.workflow_run_id // empty' <<<"$response")"
          if [[ -z "$run_id" ]]
          then
            echo "Homebrew tap dispatch did not return a workflow run ID" >&2
            exit 1
          fi
          gh run watch "$run_id" \
            --repo jordangarrison/homebrew-tap \
            --interval 10 \
            --exit-status
